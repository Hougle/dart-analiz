<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Invisible Streamlit component. Streamlit sends it the active theme with every
// render, including when the viewer switches light/dark. When the theme differs
// from the one the server styled the page for, it reports the new one, which
// makes Streamlit rerun the script so CSS and charts are rebuilt for that theme.
(function () {
  var reported = null;
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  window.addEventListener("message", function (event) {
    var msg = event.data || {};
    if (msg.type !== "streamlit:render") return;
    var base = msg.theme && msg.theme.base;
    var server = msg.args && msg.args.server;
    if (!base || base === server || base === reported) return;
    reported = base;
    send("streamlit:setComponentValue", { value: base, dataType: "json" });
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
