# DartAnaliz theme: ink-and-slate surfaces, one blue accent, Inter type.
# Light and dark are both defined; the app follows the viewer's system setting
# (they can switch in the ⋮ menu → Settings). Chart colours live in ui_helpers.colors().

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
headingFontSizes = ["1.75rem", "1.3rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 650
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eceff3"
textColor = "#0f172a"
borderColor = "#dfe3e9"
dataframeBorderColor = "#e6e9ee"
dataframeHeaderBackgroundColor = "#f1f3f6"
greenColor = "#15803d"
redColor = "#dc2626"
blueColor = "#2563eb"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f3f6"

[theme.dark]
primaryColor = "#4f8ff7"
backgroundColor = "#0b0e13"
secondaryBackgroundColor = "#161b23"
textColor = "#e6e9ef"
borderColor = "#252c37"
dataframeBorderColor = "#1f2630"
dataframeHeaderBackgroundColor = "#131820"
greenColor = "#22c55e"
redColor = "#f05252"
blueColor = "#4f8ff7"

[theme.dark.sidebar]
backgroundColor = "#0f131a"
secondaryBackgroundColor = "#161b23"
